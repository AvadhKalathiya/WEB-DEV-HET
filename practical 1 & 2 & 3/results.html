<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>

<header class="box">

    <div class="logo">
        <h2>CHARUSAT</h2>
    </div>

</header>

<section class="box">

    <a href="home.html" class="back-btn">
        ← Back to Home
    </a>

    <h1 class="title-box">
        Semester Results
    </h1>

    <div class="card">

        <label>Enrollment Number</label><br><br>

        <input id="enrollment-number" type="text" placeholder="Enter Enrollment Number">

        <br><br>

        <button id="result-search-button" type="button">Search Result</button>

        <p id="result-message" class="result-message"></p>

    </div>

    <div class="card">

        <h2>Sample Result</h2>

        <table class="result-table">

            <tr>
                <th>Subject</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>Web Development</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Data Structures</td>
                <td>B+</td>
            </tr>

            <tr>
                <td>DBMS</td>
                <td>A+</td>
            </tr>

            <tr>
                <td>Computer Networks</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Mathematics</td>
                <td>B</td>
            </tr>

        </table>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
