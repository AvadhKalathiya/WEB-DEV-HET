<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 13 - Asynchronous AJAX/Fetch CRUD (Zero Page Reload)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <span class="badge">Practical 13 • ITUE203</span>
            <h1>Single Page CRUD via Fetch API & PHP REST Endpoint</h1>
            <p>Non-blocking asynchronous data manipulations (Zero Browser Reload)</p>
        </header>

        <!-- Toast Notifications System -->
        <div id="toastContainer" class="toast-container"></div>

        <div class="crud-layout">
            <!-- Asynchronous Form Card -->
            <section class="card form-card">
                <h2>
                    <i class="fa-solid fa-bolt" id="formIcon"></i>
                    <span id="formTitle">Quick Student Add</span>
                </h2>

                <form id="asyncForm">
                    <input type="hidden" id="studentDbId" value="">

                    <div class="form-group">
                        <label for="studentId">Student ID <span class="req">*</span></label>
                        <input type="text" id="studentId" placeholder="e.g. 23IT123" required>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Full Name <span class="req">*</span></label>
                        <input type="text" id="fullName" placeholder="e.g. Het Patel" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="req">*</span></label>
                        <input type="email" id="email" placeholder="het@charusat.edu.in" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" placeholder="10-digit number">
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label for="deptSelect">Department</label>
                            <select id="deptSelect">
                                <option value="1">Information Technology</option>
                                <option value="2">Computer Engineering</option>
                                <option value="3">Computer Science & Eng</option>
                                <option value="4">Electronics & Comm</option>
                                <option value="5">Mechanical Engineering</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="semester">Semester</label>
                            <select id="semester">
                                <option value="1">Sem 1</option>
                                <option value="2">Sem 2</option>
                                <option value="3">Sem 3</option>
                                <option value="4" selected>Sem 4</option>
                                <option value="5">Sem 5</option>
                                <option value="6">Sem 6</option>
                                <option value="7">Sem 7</option>
                                <option value="8">Sem 8</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cgpa">CGPA</label>
                        <input type="number" step="0.01" min="0" max="10" id="cgpa" value="8.50">
                    </div>

                    <div class="btn-group">
                        <button type="submit" id="saveBtn" class="btn btn-primary">
                            <i class="fa-solid fa-paper-plane"></i> <span id="saveBtnText">Save Record</span>
                        </button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Asynchronous Live Data Table -->
            <section class="card table-card">
                <div class="table-top">
                    <div class="live-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="liveSearchInput" placeholder="Live search as you type...">
                    </div>
                    <button id="refreshBtn" class="btn btn-refresh" title="Reload without refresh">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>

                <div class="table-meta">
                    <span id="recordCount">Loading records...</span>
                    <span class="live-indicator"><span class="dot"></span> AJAX Live Sync</span>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name & Email</th>
                                <th>Dept</th>
                                <th>Sem</th>
                                <th>CGPA</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <tr><td colspan="6" class="loading-cell">Fetching API data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
